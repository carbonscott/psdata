[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "psdata"
version = "0.1.0"
description = "Minimal clean-room, numpy-only reader for LCLS-II xtc2 detector data"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Cong Wang", email = "cwang31@stanford.edu" }]
dependencies = ["numpy"]

[project.optional-dependencies]
# Dev/test tooling only. The acceptance tests that cross-check against psana
# need a working psana, which is the SLAC production conda build (sourced via
# psconda.sh) -- NOT a pip/uv-installable package. There is deliberately no
# [psana] extra; see the "Environment" section of the README.
test = ["pytest"]
# Demonstrator-only. `examples/cube_ray_shared_index.py` parallelizes the cube
# with Ray; Ray is NEVER imported by `psdata` itself (`import psdata` stays
# numpy-only) and is not a core dependency -- it lives here so the demo is
# installable on its own. See examples/run_cube_ray.sh for the run environment.
demo = ["ray"]

[tool.hatch.build.targets.wheel]
packages = ["src/psdata"]
